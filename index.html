<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Escolas Estaduais – SEDUC-SP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <img src="https://www.educacao.sp.gov.br/wp-content/uploads/2023/03/logo-seduc.png" alt="SEDUC-SP">
  <h1>Painel de Escolas Estaduais</h1>
  <p>Diretoria de Ensino – Campinas Leste</p>
</header>

<section class="filtros">
  <label>Município</label>
  <select id="municipio">
    <option value="">Todos</option>
  </select>

  <label>Buscar</label>
  <input type="text" id="busca" placeholder="Nome ou bairro">
</section>

<section class="acoes">
  <span id="contador">0 escolas</span>
  <div>
    <button id="limpar">Limpar</button>
  </div>
</section>

<section id="resultado" class="cards"></section>

<footer>
  © SEDUC‑SP – Diretoria de Ensino Campinas Leste
</footer>

<script src="script.js"></script>

</body>
</html>
